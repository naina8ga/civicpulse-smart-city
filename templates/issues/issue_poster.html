<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CivicPulse QR Poster #{{ issue.pk }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 2rem; border: 3px solid #1b4965; border-radius: 12px; text-align: center; }
    .tag { background: #dc2626; color: #fff; font-weight: 700; padding: 0.3rem 0.8rem; border-radius: 99px; font-size: 0.85rem; display: inline-block; }
    h1 { font-size: 1.65rem; margin: 1rem 0 0.5rem; color: #0f172a; }
    .meta { color: #475569; margin-bottom: 1.5rem; font-size: 0.95rem; }
    #qrcode { display: inline-block; padding: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 1rem; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
  <div class="tag">CIVICPULSE REPORTED ISSUE #{{ issue.pk }}</div>
  <h1>{{ issue.title }}</h1>
  <p class="meta"><strong>Location:</strong> {{ issue.location }}<br><strong>Department:</strong> {{ issue.department.name|default:"Municipal Works" }}</p>
  <div id="qrcode"></div>
  <p style="font-weight:600; color:#1b4965;">Scan to track live repair status or upvote (+1) to boost municipal priority!</p>
  <p style="font-size:0.8rem; color:#64748b;">{{ full_url }}</p>
  <button class="no-print" onclick="window.print()" style="margin-top:1.25rem; padding:0.6rem 1.2rem; background:#1b4965; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Print Street Flyer</button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>new QRCode(document.getElementById("qrcode"), { text: "{{ full_url }}", width: 180, height: 180 });</script>
</body>
</html>
